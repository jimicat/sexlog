[package]
name = "sexlog"
version = "0.1.0"
edition = "2024"
description = "本地私密的性生活记录与数据面板"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
